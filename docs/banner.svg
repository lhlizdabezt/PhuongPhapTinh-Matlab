<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Numerical Methods MATLAB Coursework</title>
  <desc id="desc">Line-free English visual for a MATLAB numerical methods coursework repository.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <style>
      .panel { fill: #ffffff; opacity: 0.94; }
      .eyebrow { fill: #0f766e; font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .title { fill: #111827; font: 700 36px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .body { fill: #374151; font: 500 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .chip { fill: #e0f2fe; }
      .chipText { fill: #0f172a; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mark { fill: #ffffff; opacity: 0.16; animation: soft 4.6s ease-in-out infinite; }
      @keyframes soft { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.28; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <rect class="mark" x="930" y="50" width="128" height="96" rx="18" />
  <rect class="mark" x="982" y="172" width="102" height="102" rx="18" />
  <rect class="panel" x="48" y="38" width="836" height="284" rx="18" />
  <text class="eyebrow" x="78" y="80">MATLAB COURSEWORK</text>
  <text class="title" x="78" y="130">Numerical Methods in MATLAB</text>
  <text class="body" x="78" y="184">Prepared GUI exercises for fixed-point iteration, Cholesky,</text>
  <text class="body" x="78" y="212">Newton interpolation, and Euler integration.</text>
  <rect class="chip" x="78" y="254" width="142" height="36" rx="12" />
  <text class="chipText" x="149" y="277" text-anchor="middle">fixed point</text>
  <rect class="chip" x="234" y="254" width="124" height="36" rx="12" />
  <text class="chipText" x="296" y="277" text-anchor="middle">cholesky</text>
  <rect class="chip" x="372" y="254" width="190" height="36" rx="12" />
  <text class="chipText" x="467" y="277" text-anchor="middle">newton interpolation</text>
  <rect class="chip" x="576" y="254" width="132" height="36" rx="12" />
  <text class="chipText" x="642" y="277" text-anchor="middle">euler method</text>
  <text x="940" y="300" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Course evidence</text>
  <text x="940" y="328" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">US English portfolio guide</text>
</svg>
